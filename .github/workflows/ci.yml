name: Tests
# A pull request is tested by its pull_request run; a push to a PR branch used
# to start a second, identical run. Pushes are tested only on main, and any
# other branch can be run by hand (Actions > Tests > Run workflow).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same pull request cancels its older, unfinished run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q nba_forecast
      # The model-change rule (AGENTS.md): a forecast change must not score worse
      # than the committed reference beyond noise. Exit code 3 means worse.
      - run: >
          python -m nba_forecast backtest
          --history datasets/espn-season-2023-24/history.json.gz datasets/espn-season-2024-25/history.json.gz datasets/regular-season-expanded-2026-10-22/history.json.gz
          --team-games datasets/espn-season-2023-24/team-games.json.gz datasets/espn-season-2024-25/team-games.json.gz datasets/model-upgrade-2026-10-23/team-games.json.gz
          --injuries datasets/injury-reports-2023-24/statuses.json.gz datasets/injury-reports-2024-25/statuses.json.gz datasets/injury-reports-2025-26/statuses.json.gz
          --market datasets/market-closing-2023-24/closing-lines.json.gz datasets/market-closing-2024-25/closing-lines.json.gz datasets/market-closing-2025-26/closing-lines.json.gz
          --output /tmp/backtest --reference datasets/backtest-2026-11-12-margins-v5 --limit 400
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --prefix dashboard
      - run: npm test --prefix dashboard
      - run: npm run build --prefix dashboard
      - run: npm exec --prefix dashboard -- playwright install --with-deps chromium
      - run: npm run test:e2e --prefix dashboard
  close-teacher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reproduce November 6 study from committed sources
        run: |
          test -f datasets/backtest-2026-11-06-rating-weight/rows.json.gz
          python -m nba_forecast.close_teacher --output /tmp/close-teacher.json
          python scripts/research/close_teacher.py --reference datasets/backtest-2026-11-06-rating-weight > /tmp/research-close-teacher.txt
          cat /tmp/research-close-teacher.txt
          python -m unittest tests.test_close_teacher.November6ReferenceTests -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: close-teacher-diagnostics
          path: |
            /tmp/close-teacher.json
            /tmp/research-close-teacher.txt
