[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-forecast"
version = "0.1.0"
description = "Auditable regular-season NBA player forecasting baseline"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nba-forecast = "nba_forecast.__main__:main"

[tool.setuptools.packages.find]
include = ["nba_forecast*"]
